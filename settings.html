<!-- 阿特拉斯 / Atlas 扩展设置抽屉：状态摘要与说明。
     真实绑定 / 世界选择操作在聊天面板的「设置」页（见 index.js）。 -->
<div id="atlas-extension-settings-root" class="inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b>阿特拉斯 / Atlas</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
  </div>
  <div class="inline-drawer-content">
    <div>
      Atlas 在当前聊天里保存世界地图、人物动向、物品与后台变化。
      打开阿特拉斯面板即可使用；浏览器版不需要安装服务端插件。
    </div>
    <div>
      推演连接与提示词预设保存在酒馆扩展设置中，可在面板编辑。
    </div>
    <div class="atlas-settings-block">
      <label for="atlas-sql-mode-toggle">
        <input type="checkbox" id="atlas-sql-mode-toggle" />
        <b>SQL 世界数据</b>（新聊天默认开启）
      </label>
      <div>
        推演、地图、附近、人物时间线使用当前聊天的同一份数据库。
        关闭后暂停推演并保留原档；重新开启后继续该数据库。
        设置键：<code>extensionSettings.atlas_world_sim.sqlMode</code>。
        SQL 核心只在开启后加载；加载失败会显示原因，原档不会被旧写入链覆盖。
      </div>
    </div>
  </div>
</div>
